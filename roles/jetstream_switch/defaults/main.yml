    port_type: ten-gigabitEthernet
    enabled: true
    description: "Trunk uplink to core switch"
    pvid: 1
    acceptable_frame_type: tagged
    vlans_tagged: [110, 3901]
    vlans_untagged: [10]

# ------------------------------------------------------------------
# ACLs (jetstream_acls)
# ------------------------------------------------------------------
jetstream_acls_state: present        # present, absent, unbind, update
jetstream_acls: []

# ------------------------------------------------------------------
# Ad-hoc commands (jetstream_command)
# ------------------------------------------------------------------
jetstream_command_level: config      # cli, enable, config
jetstream_commands: []

# ------------------------------------------------------------------
# Save (jetstream_save)
# ------------------------------------------------------------------
jetstream_save_command: "copy running-config startup-config"
