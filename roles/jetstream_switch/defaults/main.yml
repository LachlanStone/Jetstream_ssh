---
# Shared connection parameters passed via `args:` to every task.
# Kept at defaults level so users can tune it once.

jetstream_host: "{{ inventory_hostname }}"
jetstream_port: 22
jetstream_username: admin
jetstream_password: ""
jetstream_enable_password: ""
jetstream_read_timeout: 30

jetstream_connection_defaults:
  host: "{{ jetstream_host }}"
  port: "{{ jetstream_port }}"
  username: "{{ jetstream_username }}"
  password: "{{ jetstream_password }}"
  enable_password: "{{ jetstream_enable_password }}"
  read_timeout: "{{ jetstream_read_timeout }}"

# ------------------------------------------------------------------
# Feature toggles
# ------------------------------------------------------------------
jetstream_manage_system: false
jetstream_manage_users: false
jetstream_manage_vlans: false
jetstream_manage_interfaces: false
jetstream_manage_acls: false
jetstream_save_config: false
jetstream_save_when: always          # 'always' or 'on-change'

# ------------------------------------------------------------------
# System (jetstream_system)
# ------------------------------------------------------------------
jetstream_system: {}
jetstream_lldp: {}
jetstream_dns: {}
jetstream_ntp: {}

# ------------------------------------------------------------------
# Users (jetstream_user)
# ------------------------------------------------------------------
jetstream_users: []

# ------------------------------------------------------------------
# VLANs (jetstream_vlans)
# ------------------------------------------------------------------
jetstream_vlans: []

# ------------------------------------------------------------------
# Interfaces (jetstream_interfaces) — port settings on the switch.
# Defaults to empty to prevent unintended reconfiguration of ports.
# See roles/jetstream_switch/README.md or extras/jetstream_switch_example.yml
# for interface data shape and configuration examples.
# ------------------------------------------------------------------
jetstream_interfaces: []
# ------------------------------------------------------------------
# ACLs (jetstream_acls)
# ------------------------------------------------------------------
jetstream_acls_state: present        # present, absent, unbind, update
jetstream_acls: []

# ------------------------------------------------------------------
# Ad-hoc commands (jetstream_command)
# ------------------------------------------------------------------
jetstream_command_level: config      # cli, enable, config
jetstream_commands: []

# ------------------------------------------------------------------
# Save (jetstream_save)
# ------------------------------------------------------------------
jetstream_save_command: "copy running-config startup-config"
