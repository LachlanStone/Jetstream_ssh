- name: Test Omada JetStream Switch Ansible Module locally
  hosts: prod-switch-01
  connection: local
  gather_facts: false
  environment:
  tasks:
    # - name: Run commands on Omada switch
    #   lachlanstone.jetstream.jetstream_command:
    #     host: "{{ switch_host }}"
    #     port: "{{ ssh_port }}"
    #     username: "{{ ssh_username }}"
    #     password: "{{ ssh_password }}"
    #     enable_password: "{{ ssh_enable_password }}"
    #     command_level: "{{ ssh_command_level }}"
    #     # command: "{{ ssh_command }}"
    #     commands: "{{ ssh_commands }}"
    #   register: switch_result
    #   ignore_errors: true
    #   environment:
    #     ANSIBLE_NET_TEXTFSM: "{{ playbook_dir }}/../../extras/ntc_templates"
    #     NET_TEXTFSM: "{{ playbook_dir }}/../../extras/ntc_templates"

    - name: Run ACL Mangement Tool
      lachlanstone.jetstream.jetstream_acls:
        host: "{{ switch_host }}"
        port: "{{ ssh_port }}"
        username: "{{ ssh_username }}"
        password: "{{ ssh_password }}"
        enable_password: "{{ ssh_enable_password }}"
        acls:
          id: "{{ acls.id }}"
          name: "{{ acls.name }}"
          vid: "{{ acls.vid }}"
          rule_type: "{{ acls.rule_type }}"
          rules: "{{ acls.rules }}"
        state: "{{ state }}"
      register: acl_result
      ignore_errors: true
      environment:
        ANSIBLE_NET_TEXTFSM: "{{ playbook_dir }}/../../extras/ntc_templates"
        NET_TEXTFSM: "{{ playbook_dir }}/../../extras/ntc_templates"
      tags:
        - jetstream_acls
        - never


    - name: Run System Configuration Tool
      lachlanstone.jetstream.jetstream_system:
        host: "{{ switch_host }}"
        port: "{{ ssh_port }}"
        username: "{{ ssh_username }}"
        password: "{{ ssh_password }}"
        enable_password: "{{ ssh_enable_password }}"
        system:
          hostname: "{{ system.hostname }}"
          location: "{{ system.location }}"
          contact: "{{ system.contact }}"
        dns:
          primary: "{{ dns.primary }}"
          secondary: "{{ dns.secondary }}"
      register: system_result
      ignore_errors: true
      environment:
        ANSIBLE_NET_TEXTFSM: "{{ playbook_dir }}/../../extras/ntc_templates"
        NET_TEXTFSM: "{{ playbook_dir }}/../../extras/ntc_templates"
      tags:
        - jetstream_system
        - never
