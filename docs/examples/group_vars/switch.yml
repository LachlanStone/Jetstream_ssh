switch_host: 192.0.2.10
ssh_port: 22
ssh_username: admin
ssh_password: password
ssh_enable_password: password
ssh_command_level: enable
# ssh_command: "show system-info"
ssh_commands:
  - "show system-info"
  - "show users"
  - "show vlan"
state: update
system:
    hostname: "omada-switch-01"
    location: "Server Room"
    contact: "admin@example.com"
dns:
    primary: "8.8.8.8"
    secondary: "1.0.0.1"
acls:
    id: "1001"
    name: "ALLOW_DHCP"
    vid: 10
    rule_type: "combined"
    rules:
      - seq: 10
        action: permit
        logging: enable
        sip: 10.0.0.0
        sip_mask: 255.255.0.0
        dip: 10.0.0.0
        dip_mask: 255.255.0.0
        protocol_name: TCP
        dport: 9100
      - seq: 11
        action: permit
        logging: enable
        sip: 10.0.0.0
        sip_mask: 255.255.0.0
        dip: 10.0.0.0
        dip_mask: 255.255.0.0
        protocol_name: ICMP
        dport: 9100
      - seq: 20
        action: permit
        logging: enable
