# ---------------------------------------------------------------------------
# HAPPY PATH — update_password: on_create (idempotency)
# ---------------------------------------------------------------------------

- name: "[user] update_password: on_create — user already exists, should skip"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: "{{ test_users.single_admin.name }}"
    privilege: "{{ test_users.single_admin.privilege }}"
    password_type: "{{ test_users.single_admin.password_type }}"
    encryption_type: "{{ test_users.single_admin.encryption_type }}"
    user_password: "differentpassword1"
    state: present
    update_password: on_create
  register: user_on_create
  tags: [jetstream_user, user_on_create, never]

- name: "[user] Assert on_create skipped (user already exists, same privilege)"
  ansible.builtin.assert:
    that:
      - user_on_create is not failed
      - user_on_create.changed == false
    fail_msg: >
      update_password=on_create should not update existing user.
      changed={{ user_on_create.changed }}, msg={{ user_on_create.msg | default('no msg') }}
  tags: [jetstream_user, user_on_create, never]

# ---------------------------------------------------------------------------
# HAPPY PATH — update_password: always
# ---------------------------------------------------------------------------

- name: "[user] update_password: always — force update existing user"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: "{{ test_users.single_admin.name }}"
    privilege: "{{ test_users.single_admin.privilege }}"
    password_type: "{{ test_users.single_admin.password_type }}"
    encryption_type: "{{ test_users.single_admin.encryption_type }}"
    user_password: "{{ test_users.single_admin.user_password }}"
    state: present
    update_password: always
  register: user_always
  tags: [jetstream_user, user_always, never]

- name: "[user] Assert always update succeeded with changed=true"
  ansible.builtin.assert:
    that:
      - user_always is not failed
      - user_always.changed == true
    fail_msg: "update_password=always should force update: {{ user_always.msg | default('no msg') }}"
  tags: [jetstream_user, user_always, never]

# ---------------------------------------------------------------------------
# HAPPY PATH — password security (redaction assertion)
# ---------------------------------------------------------------------------

- name: "[user] Assert password is redacted in returned cmd field"
  ansible.builtin.assert:
    that:
      - user_admin.cmd is not search(test_users.single_admin.user_password)
    fail_msg: >
      SECURITY: Password appears in cmd return value unredacted.
      cmd={{ user_admin.cmd }}
  tags: [jetstream_user, user_priv_admin, user_security, never]

# ---------------------------------------------------------------------------
# HAPPY PATH — batch users list
# ---------------------------------------------------------------------------

- name: "[user] Batch create multiple users in one call"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    users:
      - name: ts_bulk1
        privilege: admin
        password_type: secret
        encryption_type: 0
        password: "BulkAdmin1!"
        state: present
        update_password: always
      - name: ts_bulk2
        privilege: guest
        password_type: password
        encryption_type: 0
        password: "BulkGuest1!"
        state: present
        update_password: on_create
      - name: ts_bulk3
        privilege: operator
        password_type: secret
        encryption_type: 0
        password: "BulkOper1!"
        state: present
        update_password: always
  register: user_bulk
  tags: [jetstream_user, user_bulk, never]

- name: "[user] Assert bulk user creation succeeded"
  ansible.builtin.assert:
    that:
      - user_bulk is not failed
      - user_bulk.changed == true
    fail_msg: "user bulk create failed: {{ user_bulk.msg | default('no msg') }}"
  tags: [jetstream_user, user_bulk, never]

# ---------------------------------------------------------------------------
# HAPPY PATH — name + users together (both paths)
# ---------------------------------------------------------------------------

- name: "[user] Use both name (top-level) and users list simultaneously"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: ts_toplevel
    privilege: guest
    password_type: secret
    encryption_type: 0
    user_password: "TopLevel1!"
    state: present
    update_password: always
    users:
      - name: ts_listlevel
        privilege: admin
        password_type: secret
        encryption_type: 0
        password: "ListLevel1!"
        state: present
        update_password: always
  register: user_both
  tags: [jetstream_user, user_both, never]

- name: "[user] Assert both name and users list processed"
  ansible.builtin.assert:
    that:
      - user_both is not failed
      - user_both.changed == true
    fail_msg: "user both paths failed: {{ user_both.msg | default('no msg') }}"
  tags: [jetstream_user, user_both, never]

# ---------------------------------------------------------------------------
# HAPPY PATH — save_config
# ---------------------------------------------------------------------------

- name: "[user] save_config: true — creates user and saves config"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: ts_savetest
    privilege: guest
    password_type: secret
    encryption_type: 0
    user_password: "SaveTest1!"
    state: present
    update_password: always
    save_config: true
  register: user_save
  tags: [jetstream_user, user_save_config, never]

- name: "[user] Assert save_config: true succeeded"
  ansible.builtin.assert:
    that:
      - user_save is not failed
      - user_save.changed == true
    fail_msg: "user save_config failed: {{ user_save.msg | default('no msg') }}"
  tags: [jetstream_user, user_save_config, never]

# ---------------------------------------------------------------------------
# HAPPY PATH — check mode
# ---------------------------------------------------------------------------

- name: "[user] Check mode — no commands sent"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: ts_checkonly
    privilege: admin
    password_type: secret
    encryption_type: 0
    user_password: "CheckOnly1!"
    state: present
    update_password: always
  check_mode: true
  register: user_check
  tags: [jetstream_user, user_check_mode, never]

- name: "[user] Assert check_mode no change"
  ansible.builtin.assert:
    that:
      - user_check is not failed
      - user_check.check_mode == true
      - user_check.changed == false
    fail_msg: "user check_mode failed: {{ user_check.msg | default('no msg') }}"
  tags: [jetstream_user, user_check_mode, never]

# ---------------------------------------------------------------------------
# HAPPY PATH — state: absent
# ---------------------------------------------------------------------------

- name: "[user] Remove a single existing user (state: absent)"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: "{{ test_users.single_guest.name }}"
    state: absent
  register: user_absent_single
  tags: [jetstream_user, user_absent, never]

- name: "[user] Assert single user removal succeeded"
  ansible.builtin.assert:
    that:
      - user_absent_single is not failed
      - user_absent_single.changed == true
    fail_msg: "user absent single failed: {{ user_absent_single.msg | default('no msg') }}"
  tags: [jetstream_user, user_absent, never]

- name: "[user] Remove already-absent user — should be idempotent"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: "{{ test_users.single_guest.name }}"
    state: absent
  register: user_absent_idempotent
  tags: [jetstream_user, user_absent, never]

- name: "[user] Assert removing already-absent user is idempotent"
  ansible.builtin.assert:
    that:
      - user_absent_idempotent is not failed
      - user_absent_idempotent.changed == false
    fail_msg: >
      Re-removing absent user should not change. changed={{ user_absent_idempotent.changed }}
  tags: [jetstream_user, user_absent, never]

# ---------------------------------------------------------------------------
# BAD DATA
# ---------------------------------------------------------------------------

- name: "[user][bad_data] Username longer than 16 characters — expect failure"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: "this_name_is_way_too_long_for_jetstream"
    privilege: admin
    password_type: secret
    encryption_type: 0
    user_password: "Password1!"
    state: present
  register: user_bad_long_name
  ignore_errors: true
  tags: [jetstream_user, bad_data, never]

- name: "[user][bad_data] Assert long username failed"
  ansible.builtin.assert:
    that:
      - user_bad_long_name is failed
    fail_msg: "Expected failure for username > 16 chars but task succeeded"
  tags: [jetstream_user, bad_data, never]

