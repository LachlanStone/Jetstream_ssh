# ---------------------------------------------------------------------------

- name: "[user][bad_data] Neither name nor users provided — expect clean exit with no-op msg"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
  register: user_no_input
  tags: [jetstream_user, bad_data, never]

- name: "[user][bad_data] Assert no-input produced clean exit, no changes"
  ansible.builtin.assert:
    that:
      - user_no_input is not failed
      - user_no_input.changed == false
    fail_msg: "No-input user task should exit cleanly: {{ user_no_input.msg | default('no msg') }}"
  tags: [jetstream_user, bad_data, never]

# ---------------------------------------------------------------------------
# TEARDOWN — remove all test users created in this block
# ---------------------------------------------------------------------------

- name: "[user] Teardown — remove all test users"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    users:
      - name: "{{ test_users.single_admin.name }}"
        state: absent
      - name: "{{ test_users.single_operator.name }}"
        state: absent
      - name: "{{ test_users.single_power.name }}"
        state: absent
      - name: "{{ test_users.single_user.name }}"
        state: absent
      - name: ts_bulk1
        state: absent
      - name: ts_bulk2
        state: absent
      - name: ts_bulk3
        state: absent
      - name: ts_toplevel
        state: absent
      - name: ts_listlevel
        state: absent
      - name: ts_savetest
        state: absent
  ignore_errors: true
  tags: [jetstream_user, user_teardown, never]
