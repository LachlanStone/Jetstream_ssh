---
# =============================================================================
# MODULE: jetstream_user
# Tests: all privilege levels, password_type (secret/password),
#        all encryption_type choices (0/5/7), state present/absent,
#        update_password (always/on_create), save_config, batch users list,
#        both name + users together, check_mode, return password redaction
# Bad data: username > 16 chars, username with spaces, missing password on create,
#           missing password on update with always, neither name nor users,
#           invalid privilege, invalid encryption_type
#
# TEARDOWN removes all test users at the end of the block.
# =============================================================================

# ---------------------------------------------------------------------------
# HAPPY PATH — single user, all privilege levels
# ---------------------------------------------------------------------------

- name: "[user] Create admin user (privilege: admin, type: secret, enc: 0)"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: "{{ test_users.single_admin.name }}"
    privilege: "{{ test_users.single_admin.privilege }}"
    password_type: "{{ test_users.single_admin.password_type }}"
    encryption_type: "{{ test_users.single_admin.encryption_type }}"
    user_password: "{{ test_users.single_admin.user_password }}"
    state: present
    update_password: always
    save_config: false
  register: user_admin
  tags: [jetstream_user, user_priv_admin, never]

- name: "[user] Assert admin user creation succeeded"
  ansible.builtin.assert:
    that:
      - user_admin is not failed
      - user_admin.changed == true
    fail_msg: "user admin create failed: {{ user_admin.msg | default('no msg') }}"
  tags: [jetstream_user, user_priv_admin, never]

# ---------------------------------------------------------------------------

- name: "[user] Create guest user (privilege: guest, type: password)"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: "{{ test_users.single_guest.name }}"
    privilege: "{{ test_users.single_guest.privilege }}"
    password_type: "{{ test_users.single_guest.password_type }}"
    encryption_type: "{{ test_users.single_guest.encryption_type }}"
