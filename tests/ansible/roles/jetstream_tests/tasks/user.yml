  ignore_errors: true
  tags: [jetstream_user, bad_data, never]

- name: "[user][bad_data] Assert invalid privilege failed"
  ansible.builtin.assert:
    that:
      - user_bad_priv is failed
    fail_msg: "Expected failure for invalid privilege but task succeeded"
  tags: [jetstream_user, bad_data, never]

# ---------------------------------------------------------------------------

- name: "[user][bad_data] Invalid encryption_type — expect Ansible validation failure"
  lachlanstone.jetstream.jetstream_user:
    host: "{{ test_host }}"
    port: "{{ test_port }}"
    username: "{{ test_username }}"
    password: "{{ test_password }}"
    enable_password: "{{ test_enable_password }}"
    name: ts_badenc
    privilege: admin
    password_type: secret
    encryption_type: 3
    user_password: "Password1!"
    state: present
  register: user_bad_enc
  ignore_errors: true
  tags: [jetstream_user, bad_data, never]

- name: "[user][bad_data] Assert invalid encryption_type failed"
  ansible.builtin.assert:
